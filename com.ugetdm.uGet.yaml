app-id: com.ugetdm.uGet
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: uget-gtk
rename-icon: uget-icon
rename-desktop-file: uget-gtk.desktop
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Audio access
  # for sound notifications
  - --socket=pulseaudio
  # Filesystem access
  - --filesystem=xdg-download
  # Network access
  - --share=network
  # Tray icon
  - --talk-name=org.freedesktop.Notifications
  # OpenGL access
  - --device=dri
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - "*.a"
modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  - name: c-ares
    sources:
      - type: archive
        url: https://github.com/c-ares/c-ares/releases/download/v1.34.9/c-ares-1.34.9.tar.gz
        sha256: 9364b70a12eb59a06830fb488d9357f90100dff0d98b23ea3593a183d43e6f2f
        x-checker-data:
          type: anitya
          project-id: 5840
          url-template: https://github.com/c-ares/c-ares/releases/download/v$version/c-ares-$version.tar.gz

  - name: libssh2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_SHARED_LIBS:BOOL=ON
    sources:
      - type: archive
        url: https://www.libssh2.org/download/libssh2-1.11.1.tar.gz
        sha256: d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7
        x-checker-data:
          type: anitya
          project-id: 1730
          url-template: https://www.libssh2.org/download/libssh2-$version.tar.gz

  - name: aria2
    config-opts:
      - --enable-bittorrent
      - --enable-metalink
      - --enable-websocket
      - --enable-epoll
      - --with-libcares
      - --with-libxml2
      - --with-libz
      - --with-sqlite3
      # GnuTLS has precedence over OpenSSL if both libraries are installed.
      - --without-gnutls
      - --with-openssl
      - --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b
        x-checker-data:
          type: anitya
          project-id: 109
          url-template: https://github.com/aria2/aria2/releases/download/release-$version/aria2-$version.tar.xz

  - name: uGet
    post-install:
      - install -Dm644 pixmaps/icons/hicolor/scalable/apps/uget-icon.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 ${FLATPAK_ID}.appdata.xml -t /app/share/metainfo/
      - install -Dm644 uget-gtk.desktop -t /app/share/applications/
      - desktop-file-edit --set-key=Exec --set-value="uget-gtk %u" /app/share/applications/uget-gtk.desktop
    sources:
      - type: archive
        url: https://sourceforge.net/projects/urlget/files/uget%20%28stable%29/2.2.3/uget-2.2.3-1.tar.gz
        sha256: 11356e4242151b9014fa6209c1f0360b699b72ef8ab47dbeb81cc23be7db9049
      - type: patch
        paths:
          - gcc-10.patch
          - gcc-15.patch
          - use_download_dir_as_default.patch
      - type: file
        path: com.ugetdm.uGet.appdata.xml
